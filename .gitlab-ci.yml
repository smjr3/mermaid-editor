image: node:24.16.0

stages:
  - deploy

pages:
  stage: deploy
  variables:
    MERMAID_BASE_PATH: '/$CI_PROJECT_NAME'
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
    - mv docs public
  artifacts:
    paths:
      - public
  pages: true

