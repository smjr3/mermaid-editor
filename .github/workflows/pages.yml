# Publishes the site to GitHub Pages (https://smjr3.github.io/mermaid-editor/).
# Fork-only, like fork-checks.yml and publish.yml. One-time setting: repository
# Settings > Pages > Source: "GitHub Actions" (see README).
#
# The sub-path comes from MERMAID_BASE_PATH, the same variable the GitLab Pages example
# uses (svelte.config.js, paths.base). The repository's default .env stays as it is:
# external services remain off.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          MERMAID_BASE_PATH: /mermaid-editor

      # Jekyll would drop the underscore-prefixed _app/ directory.
      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
