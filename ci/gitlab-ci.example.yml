# Example: publish the editor as a static site with GitLab Pages.
#
# This is a template, not an active pipeline. To use it, copy it to `.gitlab-ci.yml` at the
# root of the repository you build from and adjust the variables.
#
# The job below targets a Linux Docker executor. The `script` steps themselves
# are platform-neutral — they run Node, never a shell builtin — so the same
# steps work unchanged on a Windows runner; see the Windows section at the
# bottom for the two keys that differ. Any other static host works too: run
# `pnpm build` and publish the generated `docs/` directory.

image: node:24.16.0

stages:
  - deploy

pages:
  stage: deploy
  variables:
    MERMAID_BASE_PATH: '/$CI_PROJECT_NAME'
  before_script:
    - corepack enable pnpm
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
    - pnpm build:pages
  artifacts:
    paths:
      - public
  pages: true

# ---------------------------------------------------------------------------
# Vendor icon sets imported at build time (docs-dev/ICONS.md)
#
# Official AWS / Azure / Google Cloud icon sets cannot ship in the repository.
# `pnpm build` downloads the archives this variable names (prefix=zip URL) and
# bundles them, so set it in Settings > CI/CD > Variables or here. The AWS and
# Azure URLs change with each release; copy the current link from the vendor's
# download page.
#
#   variables:
#     MERMAID_FETCH_ICON_PACKS: 'gcp=https://cloud.google.com/static/icons/files/google-cloud-icons.zip,aws=https://d1.awsstatic.com/…/Asset-Package_….zip'
#
# A site that may not host third-party logos also sets MERMAID_BUNDLE_LOGOS: 'false'.
#
# ---------------------------------------------------------------------------
# Windows runner
#
# `image:` applies only to Docker executors and names a Linux image, so a
# Windows shell runner needs it removed and Node installed on the runner
# itself. Nothing else changes: `pnpm build:pages` replaces what used to be
# `mv docs public`, and runs the same on cmd.exe, PowerShell and sh.
#
# pages:
#   stage: deploy
#   tags:
#     - windows
#   variables:
#     MERMAID_BASE_PATH: "/$CI_PROJECT_NAME"
#   before_script:
#     - corepack enable pnpm
#     - pnpm install --frozen-lockfile
#   script:
#     - pnpm build
#     - pnpm build:pages
#   artifacts:
#     paths:
#       - public
#   pages: true
#
# ---------------------------------------------------------------------------
# Alternative: build the published npm package obtained through a private npm
# registry or mirror. Enable this job instead of the source-based `pages` job above, and
# define the masked CI variables NPM_REGISTRY_URL and NPM_TOKEN. Keep the
# package version pinned.
#
# The npm/tar steps below are POSIX-shell specific; on a Windows runner obtain
# and unpack the tarball with the runner's own tooling, then the build steps are
# again `npm run build` followed by `npm run build:pages`.
#
# pages:
#   stage: deploy
#   variables:
#     MERMAID_BASE_PATH: "/$CI_PROJECT_NAME"
#     MERMAID_EDITOR_VERSION: "0.1.0"
#   before_script:
#     - printf 'registry=%s\n//%s/:_authToken=%s\n' "$NPM_REGISTRY_URL" "${NPM_REGISTRY_URL#*://}" "$NPM_TOKEN" > "$CI_PROJECT_DIR/.npmrc"
#     - mkdir "$CI_PROJECT_DIR/package"
#     - cd "$CI_PROJECT_DIR/package"
#     - npm pack "@smjr3/mermaid-editor@$MERMAID_EDITOR_VERSION"
#     - tar -xzf smjr3-mermaid-editor-*.tgz --strip-components=1
