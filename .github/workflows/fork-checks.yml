# Checks that exist only in this fork. Kept in their own workflow so upstream's
# tests.yml / unit-tests.yml stay untouched and keep merging cleanly.
name: Fork Checks

on:
  pull_request:
    branches:
      - master
  schedule:
    # Weekly, so a new advisory against an unchanged lockfile is still noticed.
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  local-delta:
    # docs-dev/UPSTREAM.md's inventory and package.json lists vs the repository.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The check diffs against vendorBaseCommit, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Check the documented local delta
        run: node scripts/check-local-delta.js

  audit:
    # Both install paths: pnpm here, and npm as the published tarball is
    # installed internally. npm ignores pnpm.overrides, so one clean audit does
    # not imply the other (docs-dev/QUALITY-AUDIT-2026-08-31.md).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # No cache: 'pnpm' — nothing here runs pnpm install, so there is no store
      # to save and the post-job cache step fails the job.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Audit production dependencies (pnpm)
        run: pnpm audit --prod

      - name: Audit the published tarball as npm installs it
        run: |
          work="$(mktemp -d)"
          npm pack --pack-destination "$work"
          tar -xzf "$work"/*.tgz -C "$work"
          cd "$work/package"
          # Resolve without installing: the lockfile is all npm audit needs.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev

  build-from-package:
    # scripts/update-from-registry.mjs against the public registry, on the platform
    # it exists for. First thing in this repository to run on a Windows runner
    # (docs-dev/CROSS-PLATFORM.md). No browser tests, no cache.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Unit tests for the script
        run: node --test scripts/update-from-registry.node-test.mjs

      - name: Download, extract, install and build 0.2.1
        run: node scripts/update-from-registry.mjs --version 0.2.1 --dir "${{ runner.temp }}/me"

      - name: Assert the four outputs
        shell: node {0}
        run: |
          const { existsSync } = require('node:fs');
          const { join } = require('node:path');
          const docs = join(process.env.RUNNER_TEMP, 'me', 'docs');
          const missing = ['index.html', 'edit.html', 'view.html', '_app'].filter(
            (name) => !existsSync(join(docs, name))
          );
          if (missing.length > 0) {
            console.error(`missing in ${docs}: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`all present in ${docs}`);
