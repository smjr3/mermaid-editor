# GitLab Pages deployment.
#
# The job below targets a Linux Docker executor. The `script` steps themselves
# are platform-neutral — they run Node, never a shell builtin — so the same
# steps work unchanged on a Windows runner; see the Windows section at the
# bottom for the two keys that differ.

image: node:24.16.0

stages:
  - deploy

pages:
  stage: deploy
  variables:
    MERMAID_BASE_PATH: '/$CI_PROJECT_NAME'
  before_script:
    - corepack enable pnpm
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
    - pnpm build:pages
  artifacts:
    paths:
      - public
  pages: true

# ---------------------------------------------------------------------------
# Icon packs the deployment hosts (docs-dev/ICONS.md)
#
# Official vendor icon sets cannot ship in the repository. To offer one on this
# site, add these to the `pages` job: download and unpack the vendor's SVG
# archive (accepting its terms) into azure-icons/ in an earlier step, then
#
#   variables:
#     MERMAID_ICON_PACKS: 'azure=./icon-packs/azure.json'
#   script:
#     - pnpm build
#     - pnpm build:pages
#     - node scripts/svg-to-iconify.js azure-icons azure public/icon-packs/azure.json
#
# ---------------------------------------------------------------------------
# Windows runner
#
# `image:` applies only to Docker executors and names a Linux image, so a
# Windows shell runner needs it removed and Node installed on the runner
# itself. Nothing else changes: `pnpm build:pages` replaces what used to be
# `mv docs public`, and runs the same on cmd.exe, PowerShell and sh.
#
# pages:
#   stage: deploy
#   tags:
#     - windows
#   variables:
#     MERMAID_BASE_PATH: "/$CI_PROJECT_NAME"
#   before_script:
#     - corepack enable pnpm
#     - pnpm install --frozen-lockfile
#   script:
#     - pnpm build
#     - pnpm build:pages
#   artifacts:
#     paths:
#       - public
#   pages: true
#
# ---------------------------------------------------------------------------
# Alternative: build the published npm package obtained through an internal
# registry. Enable this job instead of the source-based `pages` job above, and
# define the masked CI variables NPM_REGISTRY_URL and NPM_TOKEN. Keep the
# package version pinned.
#
# The npm/tar steps below are POSIX-shell specific; on a Windows runner obtain
# and unpack the tarball with the runner's own tooling, then the build steps are
# again `npm run build` followed by `npm run build:pages`.
#
