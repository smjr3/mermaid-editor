image: node:24.16.0

variables:
  MERMAID_BASE_PATH: '/$CI_PROJECT_NAME'

pages:
  stage: deploy
  script:
    - npm install --global pnpm@10.34.5
    - pnpm install --frozen-lockfile
    - pnpm build
    - rm -rf public
    - mv docs public
  artifacts:
    paths:
      - public

