<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online FlowChart &amp; Diagrams Editor - Mermaid Live Editor</title>
    <meta name="og:image" content="%sveltekit.assets%/favicon.svg" />
    <meta
      name="description"
      content="Simplify documentation and avoid heavy tools. Open source Visio Alternative. Commonly used for explaining your code! Mermaid is a simple markdown-like script language for generating charts from text via javascript." />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#000000" />
    <meta name="theme-color" content="#29cbe0" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <script>
      /*
        Default this editor to dark, while leaving an explicit user choice alone.

        Setting <ModeWatcher defaultMode="dark" /> alone does not work: mode-watcher's
        UserPrefersMode singleton is constructed at module-import time with its own
        hardcoded "system" default and persists it, so by the time the component's
        onMount reads localStorage the key already holds a valid mode and defaultMode
        is never reached. Seeding the key here, above SvelteKit's head placeholder
        below and therefore before any module loads, is what changes the default.

        Someone who picks light has "light" stored, so this leaves it untouched.
      */
      try {
        var modeKey = 'mode-watcher-mode';
        if (!localStorage.getItem(modeKey)) {
          localStorage.setItem(modeKey, 'dark');
        }
      } catch (error) {
        // Storage can be unavailable (private mode, blocked cookies). ModeWatcher's
        // defaultMode prop still applies in that case.
      }
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
